<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cores e Efeitos</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎨 Cadastro de Cores e Efeitos</h1>
      <p>Consulte as cores, códigos e utilizações estratégicas</p>
    </header>

    <div class="search-section">
      <!-- Abas -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="cores">Cores</button>
        <button class="tab-btn" data-tab="efeitos">Efeitos</button>
      </div>

      <!-- Controles de pesquisa -->
      <div class="search-controls">
        <div class="form-group">
          <label for="searchInput">Pesquisar</label>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Digite um termo para pesquisar..."
          >
        </div>

        <div class="form-group">
          <label for="searchField">Campo</label>
          <select id="searchField">
            <option value="">Todos os campos</option>
          </select>
        </div>

        <div>
          <button class="btn-search" id="btnSearch">🔍 Pesquisar</button>
          <button class="btn-clear" id="btnClear">Limpar</button>
        </div>
      </div>
    </div>

    <!-- Resultados -->
    <div class="results-section">
      <div class="results-info" id="resultsInfo">
        <p>Carregando dados...</p>
      </div>
      <div class="results-grid" id="results">
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando dados...</p>
        </div>
      </div>
    </div>

    <footer>
      <p>© 2024 Cadastro de Cores e Efeitos | Aplicação estática para GitHub Pages</p>
    </footer>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
