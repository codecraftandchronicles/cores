name: Supabase Synthetic Activity
on:
  schedule:
    # Roda a cada hora, no minuto 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  synthetic-insert:
    runs-on: ubuntu-latest
    steps:
      - name: Inserir linha sintética
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/paint_votes_synthetic" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
                  "paint_code": "SYNTHETIC_KEEPALIVE",
                  "vote_type": "like",
                  "session_id": "gh-actions-keepalive",
                  "voter_ip": "localhost"
                }')
          echo "HTTP Status: $CODE"
          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            echo "✅ Linha sintética inserida."
          else
            echo "❌ Falha ao inserir (HTTP $CODE). Verifique a key/policy."
            exit 1
          fi
